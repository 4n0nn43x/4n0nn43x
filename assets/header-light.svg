<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="218"
     viewBox="0 0 1000 218" role="img"
     aria-label="Nolwen Sean Hononta, fullstack engineer. Focus: fullstack product work from interface to chain; agent payment rails, x402 and MPP; onchain settlement and ERC-8004 verdicts. Status: open to work.">
  <title>Nolwen Sean Hononta</title>

  <rect width="1000" height="218" fill="#EFEDE6"/>

  <!-- The brass edge. One accent in the whole asset, and it is a margin rule
       rather than a decorative rail: it marks where the document begins. -->
  <rect x="0" y="0" width="4" height="218" fill="#9A6E12">
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </rect>

  <text x="52" y="96" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52"
        font-weight="800" letter-spacing="-1.6" fill="#1A1712">Nolwen Sean Hononta</text>

  <!-- The rule draws once, left to right, and then the page is still. -->
  <rect x="52" y="124" width="896" height="1" fill="#CFC9BB">
    <animate attributeName="width" from="0" to="896" dur="0.9s"
             fill="freeze" calcMode="linear"
             values="0;896;896" keyTimes="0;0.6;1"/>
  </rect>

  <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.35s" fill="freeze"/><text x="52" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="2.6" fill="#A79D8C">REF</text><text x="52" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#6B6254">github.com/4n0nn43x</text></g>
  <text x="302" y="158" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="2.6" fill="#A79D8C">FOCUS<animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/></text><text x="302" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#1A1712" opacity="1">fullstack - interface, API, chain<animate attributeName="opacity" dur="12.149999999999999s" repeatCount="indefinite" values="1;1;1;1;0;0" keyTimes="0.00000;0.00000;0.03704;0.29630;0.33333;1.00000"/></text><text x="302" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#1A1712" opacity="0">agent payment rails - x402 v2, MPP<animate attributeName="opacity" dur="12.149999999999999s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.33333;0.37037;0.62963;0.66667;1.00000"/></text><text x="302" y="186" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#1A1712" opacity="0">onchain settlement - ERC-8004 verdicts<animate attributeName="opacity" dur="12.149999999999999s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0.00000;0.66667;0.70370;0.96296;1.00000;1.00000"/></text>
  <g opacity="1"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.85s" fill="freeze"/><text x="948" y="158" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" letter-spacing="2.6" fill="#A79D8C">STATUS</text><text x="948" y="186" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" fill="#1A1712">open to work</text><circle cx="820" cy="181" r="3.5" fill="#9A6E12"><animate attributeName="opacity" values="1;0.25;1" dur="2.6s" repeatCount="indefinite"/></circle></g>
</svg>
